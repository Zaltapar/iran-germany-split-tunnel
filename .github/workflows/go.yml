name: Go

on:
  push:
    # main gets every push; the production-hardening branch is listed too
    # so its changes (which cannot run `go test -race` on the Windows dev
    # host) are race-tested by this same Linux workflow.
    branches: [main, hardening/production-reliability]
  pull_request:
  # Issue #9: the L4 two-process local integration gate runs the REAL
  # production binaries as two OS processes (real sockets, real
  # WebSocket, real SOCKS5, failure injection). It is NOT part of the
  # automatic PR gate (it takes minutes and is meant for acceptance
  # verification); run it on demand from the Actions tab.
  workflow_dispatch:
    inputs:
      twoproc_race:
        description: "Build the splitters with -race for the L4 gate (slower)"
        type: boolean
        default: false

jobs:
  test:
    name: Linux build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      # T3 Pinned-Xray gate: the REAL pinned Xray binary (v26.3.27,
      # SHA-256-verified against the upstream .dgst sidecar) validates the
      # generated Germany config (design doc plans/t3-design.md §7). This
      # is the "do not call T3 complete before Linux CI is green" gate.
      # Internet dependency is intentional and isolated to this step only;
      # the hermetic unit suite above never touches the network.
      - name: Pinned Xray gate
        run: |
          set -euo pipefail
          # 1) Render the fixed-vector Germany config; capture its stable path.
          CFG=$(go test -v -tags xraye2e -run TestE2ERenderGolden ./internal/xray/ \
            | grep -oE 'E2E_CONFIG_PATH=.*' | head -n1 | cut -d= -f2)
          test -n "$CFG" && test -f "$CFG"
          echo "Validating config: $CFG"

          # 2) Download the pinned release + digest (URLs match the
          #    internal/xray/version.go constants for v26.3.27 linux-64).
          VER=v26.3.27
          cd "$(mktemp -d)"
          curl -fsSL -o xray.zip  "https://github.com/XTLS/Xray-core/releases/download/${VER}/Xray-linux-64.zip"
          curl -fsSL -o xray.dgst "https://github.com/XTLS/Xray-core/releases/download/${VER}/Xray-linux-64.zip.dgst"

          # 3) Verify SHA-256 against the upstream .dgst ("SHA2-256= <hex>").
          EXPECTED=$(grep -iE '^[[:space:]]*SHA2-256[[:space:]]*[=:]' xray.dgst | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          test -n "$EXPECTED"
          ACTUAL=$(sha256sum xray.zip | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          unzip -q xray.zip
          XRAY=./xray
          test -x "$XRAY"
          "$XRAY" version | grep -q Xray

          # 4) x25519 line-shape assertions (keygen.go's parsing contract:
          #    exactly 3 labeled lines, each value 43 chars unpadded base64url).
          OUT=$("$XRAY" x25519)
          test "$(printf '%s\n' "$OUT" | grep -c .)" -eq 3
          printf '%s\n' "$OUT" | sed -n '1p' | grep -q '^PrivateKey: '
          printf '%s\n' "$OUT" | sed -n '2p' | grep -q '^Password (PublicKey): '
          printf '%s\n' "$OUT" | sed -n '3p' | grep -q '^Hash32: '
          for v in \
            "$(printf '%s\n' "$OUT" | sed -n '1p' | sed 's/^PrivateKey: //')" \
            "$(printf '%s\n' "$OUT" | sed -n '2p' | sed 's/^Password (PublicKey): //')" \
            "$(printf '%s\n' "$OUT" | sed -n '3p' | sed 's/^Hash32: //')"; do
            printf '%s' "$v" | grep -qE '^[A-Za-z0-9_-]{43}$' || { echo "unexpected x25519 value shape"; exit 1; }
          done

          # 5) The real binary must accept the generated config. The config's
          #    error log path is the production location (doc §4.5); create
          #    the directory in CI as T5 will on the real node. The runner
          #    user is non-root, so the system dir needs sudo, and xray
          #    (running as the runner user) needs to be able to open the
          #    error log file inside it.
          sudo mkdir -p /var/log/split-tunnel
          sudo chown "$(id -un):$(id -gn)" /var/log/split-tunnel
          "$XRAY" run -test -config "$CFG"

      # T4 Pinned-Caddy gate: the REAL pinned Caddy binary (v2.11.4,
      # SHA-512-verified against the upstream-published
      # caddy_2.11.4_checksums.txt) validates every generated Caddyfile
      # variant (design doc plans/t4-design.md §6, review HIGH-R2-2).
      # The pinned release is the authority on the generated config,
      # exactly like the Xray gate is for the Germany config. Internet
      # dependency is intentional and isolated to this step only; the
      # hermetic unit suite above never touches the network.
      - name: Pinned Caddy gate
        run: |
          set -euo pipefail
          # 1) Render the fixed-vector Caddyfiles; capture their stable
          #    paths (the e2e helper prints one marker per variant).
          OUT=$(go test -v -tags caddye2e -run TestE2ERenderGoldens ./internal/origin/)
          MARKERS=$(printf '%s\n' "$OUT" | grep -oE 'E2E_CADDYFILE_PATH=[^ ]+')
          CF_DEFAULT=$(printf '%s\n' "$MARKERS" | awk -F= '$2=="caddy-default"{print $3}')
          CF_ALPN=$(printf '%s\n' "$MARKERS" | awk -F= '$2=="caddy-alpn01"{print $3}')
          CF_CDN=$(printf '%s\n' "$MARKERS" | awk -F= '$2=="cdn-tls-internal"{print $3}')
          test -n "$CF_DEFAULT" && test -f "$CF_DEFAULT"
          test -n "$CF_ALPN" && test -f "$CF_ALPN"
          test -n "$CF_CDN" && test -f "$CF_CDN"

          # 2) Download the pinned release + checksums (URLs match the
          #    internal/origin/version.go constants for v2.11.4
          #    linux-amd64; the asset name drops the leading "v").
          VER=v2.11.4
          TAR=caddy_2.11.4_linux_amd64.tar.gz
          CKS=caddy_2.11.4_checksums.txt
          cd "$(mktemp -d)"
          curl -fsSL -o "$TAR" "https://github.com/caddyserver/caddy/releases/download/${VER}/${TAR}"
          curl -fsSL -o "$CKS" "https://github.com/caddyserver/caddy/releases/download/${VER}/${CKS}"

          # 3) Verify SHA-512 against the upstream checksums file. The
          #    parse mirrors internal/origin/checksum.go ParseChecksumFile:
          #    "<128-hex><two spaces><name>" (a leading '*' marker
          #    tolerated), the name field must match the asset EXACTLY.
          #    (No {n} regex intervals: the runner awk is mawk, which
          #    does not support them — index()/length() instead.)
          EXPECTED=$(awk -v t="$TAR" '
            {
              line=$0
              sub(/^[ \t]*/, "", line)
              if (line ~ /^#/) next
              if (substr(line, 1, 1) == "*") line = substr(line, 2)
              p = index(line, "  ")
              if (p == 0) next
              hex = substr(line, 1, p - 1)
              name = substr(line, p + 2)
              gsub(/^[ \t]+/, "", hex); gsub(/[ \t]+$/, "", hex)
              gsub(/^[ \t]+/, "", name); gsub(/[ \t]+$/, "", name)
              if (length(hex) != 128) next
              if (hex !~ /^[0-9A-Fa-f]+$/) next
              if (name == t) { print hex; exit }
            }' "$CKS")
          test -n "$EXPECTED"
          EXPECTED=$(printf '%s' "$EXPECTED" | tr 'A-F' 'a-f')
          ACTUAL=$(sha512sum "$TAR" | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          tar -xzf "$TAR"
          CADDY=./caddy
          test -x "$CADDY"

          # 4) Smoke: the binary reports the pinned version (the
          #    installer's gate checks its FIRST field == v2.11.4).
          test "$("$CADDY" version | awk '{print $1}')" = "$VER"

          # 5) The real binary must accept every generated Caddyfile
          #    variant (ACME http01 default, tlsalpn01, tls internal).
          for CFG in "$CF_DEFAULT" "$CF_ALPN" "$CF_CDN"; do
            echo "Validating config: $CFG"
            "$CADDY" validate --config "$CFG"
          done

      - name: go build (host)
        run: go build ./...
      # The L4 two-process gate (Issue #9): only on manual dispatch.
      - name: L4 two-process local gate (on-demand)
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_TWOPROC: "1"
          TWOPROC_RACE: ${{ github.event.inputs.twoproc_race == 'true' && '1' || '0' }}
        run: go test -count=1 -v -timeout 10m -run TestTwoProcessLocal ./integration/

      - name: go build (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...