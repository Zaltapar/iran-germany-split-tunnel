name: Go

on:
  push:
    # main gets every push; the production-hardening branch is listed too
    # so its changes (which cannot run `go test -race` on the Windows dev
    # host) are race-tested by this same Linux workflow.
    branches: [main, hardening/production-reliability]
  pull_request:
  # Issue #9: the L4 two-process local integration gate runs the REAL
  # production binaries as two OS processes (real sockets, real
  # WebSocket, real SOCKS5, failure injection). It is NOT part of the
  # automatic PR gate (it takes minutes and is meant for acceptance
  # verification); run it on demand from the Actions tab.
  workflow_dispatch:
    inputs:
      twoproc_race:
        description: "Build the splitters with -race for the L4 gate (slower)"
        type: boolean
        default: false

jobs:
  test:
    name: Linux build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      # T3 Pinned-Xray gate: the REAL pinned Xray binary (v26.3.27,
      # SHA-256-verified against the upstream .dgst sidecar) validates the
      # generated Germany config (design doc plans/t3-design.md §7). This
      # is the "do not call T3 complete before Linux CI is green" gate.
      # Internet dependency is intentional and isolated to this step only;
      # the hermetic unit suite above never touches the network.
      - name: Pinned Xray gate
        run: |
          set -euo pipefail
          # 1) Render the fixed-vector Germany config; capture its stable path.
          CFG=$(go test -v -tags xraye2e -run TestE2ERenderGolden ./internal/xray/ \
            | grep -oE 'E2E_CONFIG_PATH=.*' | head -n1 | cut -d= -f2)
          test -n "$CFG" && test -f "$CFG"
          echo "Validating config: $CFG"

          # 2) Download the pinned release + digest (URLs match the
          #    internal/xray/version.go constants for v26.3.27 linux-64).
          VER=v26.3.27
          cd "$(mktemp -d)"
          curl -fsSL -o xray.zip  "https://github.com/XTLS/Xray-core/releases/download/${VER}/Xray-linux-64.zip"
          curl -fsSL -o xray.dgst "https://github.com/XTLS/Xray-core/releases/download/${VER}/Xray-linux-64.zip.dgst"

          # 3) Verify SHA-256 against the upstream .dgst ("SHA2-256= <hex>").
          EXPECTED=$(grep -iE '^[[:space:]]*SHA2-256[[:space:]]*[=:]' xray.dgst | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          test -n "$EXPECTED"
          ACTUAL=$(sha256sum xray.zip | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          unzip -q xray.zip
          XRAY=./xray
          test -x "$XRAY"
          "$XRAY" version | grep -q Xray

          # 4) x25519 line-shape assertions (keygen.go's parsing contract:
          #    exactly 3 labeled lines, each value 43 chars unpadded base64url).
          OUT=$("$XRAY" x25519)
          test "$(printf '%s\n' "$OUT" | grep -c .)" -eq 3
          printf '%s\n' "$OUT" | sed -n '1p' | grep -q '^PrivateKey: '
          printf '%s\n' "$OUT" | sed -n '2p' | grep -q '^Password (PublicKey): '
          printf '%s\n' "$OUT" | sed -n '3p' | grep -q '^Hash32: '
          for v in \
            "$(printf '%s\n' "$OUT" | sed -n '1p' | sed 's/^PrivateKey: //')" \
            "$(printf '%s\n' "$OUT" | sed -n '2p' | sed 's/^Password (PublicKey): //')" \
            "$(printf '%s\n' "$OUT" | sed -n '3p' | sed 's/^Hash32: //')"; do
            printf '%s' "$v" | grep -qE '^[A-Za-z0-9_-]{43}$' || { echo "unexpected x25519 value shape"; exit 1; }
          done

          # 5) The real binary must accept the generated config. The config's
          #    error log path is the production location (doc §4.5); create
          #    the directory in CI as T5 will on the real node.
          mkdir -p /var/log/split-tunnel
          "$XRAY" run -test -config "$CFG"

      - name: go build (host)
        run: go build ./...
      # The L4 two-process gate (Issue #9): only on manual dispatch.
      - name: L4 two-process local gate (on-demand)
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_TWOPROC: "1"
          TWOPROC_RACE: ${{ github.event.inputs.twoproc_race == 'true' && '1' || '0' }}
        run: go test -count=1 -v -timeout 10m -run TestTwoProcessLocal ./integration/

      - name: go build (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...